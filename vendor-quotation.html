<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendor Quotation Submission</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#1f4e79;
    color:white;
    padding:15px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#163a5d;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#1f4e79;
    color:white;
}

.edit-btn{
    background:orange;
}

.back-btn{
    margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
    <h2>Vendor Quotation Submission</h2>
</div>

<div class="container">

<div class="card">

<h3>Submit Quotation</h3>

<label>RFQ</label>

<select id="rfq">
    <option>Laptop Procurement</option>
    <option>Office Furniture</option>
    <option>Network Equipment</option>
</select>

<label>Vendor Name</label>
<input type="text" id="vendor">

<label>Price (₹)</label>
<input type="number" id="price">

<label>Delivery Timeline (Days)</label>
<input type="number" id="timeline">

<label>Notes / Comments</label>
<textarea id="notes"></textarea>

<button onclick="submitQuotation()">
Submit Quotation
</button>

</div>

<div class="card">

<h3>Submitted Quotations</h3>

<table>

<thead>

<tr>
<th>RFQ</th>
<th>Vendor</th>
<th>Price</th>
<th>Delivery Days</th>
<th>Notes</th>
<th>Action</th>
</tr>

</thead>

<tbody id="quotationTable">

</tbody>

</table>

</div>

<button
class="back-btn"
onclick="window.location.href='dashboard.html'">
Back to Dashboard
</button>

</div>

<script>

let quotations=[];
let editIndex=-1;

function submitQuotation(){

let quotation={

rfq:document.getElementById("rfq").value,

vendor:document.getElementById("vendor").value,

price:document.getElementById("price").value,

timeline:document.getElementById("timeline").value,

notes:document.getElementById("notes").value

};

if(
quotation.vendor=="" ||
quotation.price=="" ||
quotation.timeline==""
){
alert("Please fill all required fields");
return;
}

if(editIndex==-1){

quotations.push(quotation);

}else{

quotations[editIndex]=quotation;
editIndex=-1;

}

displayQuotations();

clearForm();

}

function displayQuotations(){

let table=document.getElementById("quotationTable");

table.innerHTML="";

quotations.forEach((q,index)=>{

table.innerHTML += `
<tr>

<td>${q.rfq}</td>

<td>${q.vendor}</td>

<td>₹${q.price}</td>

<td>${q.timeline}</td>

<td>${q.notes}</td>

<td>

<button
class="edit-btn"
onclick="editQuotation(${index})">

Edit

</button>

</td>

</tr>
`;

});

}

function editQuotation(index){

let q=quotations[index];

rfq.value=q.rfq;
vendor.value=q.vendor;
price.value=q.price;
timeline.value=q.timeline;
notes.value=q.notes;

editIndex=index;

}

function clearForm(){

vendor.value="";
price.value="";
timeline.value="";
notes.value="";

}

</script>

</body>
</html>
